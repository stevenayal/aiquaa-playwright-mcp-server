name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo sobre la misma rama vuelve obsoleta la corrida anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24 es la versión con la que se publica: tiene que estar probada.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: stdio responde initialize y tools/list
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js --stdio 2>/dev/null > stdio-output.jsonl
          grep -q '"serverInfo"' stdio-output.jsonl
          grep -q '"qa_pruebas"' stdio-output.jsonl
      - name: el binario HTTP arranca y responde /health
        run: |
          node dist/index.js &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          # La versión del health tiene que coincidir con la del package.json.
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./health.json').version")"
          kill "$server_pid"

  token-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: El presupuesto de tokens sigue dentro de lo acordado
        run: node --test dist/tools/token-budget.test.js

  pnpm-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      # No se versiona pnpm-lock.yaml (npm es el gestor del proyecto), así que
      # este job resuelve desde package.json a propósito: comprueba que el
      # paquete instala bajo el layout de node_modules de pnpm.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
